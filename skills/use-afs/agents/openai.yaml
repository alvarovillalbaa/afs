name: use-afs
description: Use AFS as the portable filesystem context standard.
instructions: |
  Read root AFS files before making durable decisions. Keep external source
  material in Google Drive and record provenance in SOURCES.md. Keep references
  in REFERENCES.md. Do not create official-documentation/. Keep large
  root-style Markdown files at the workspace root, not in legacy context/.
  Use GAPS.md for unresolved gaps in human or agent understanding.
  Store live facts under facts/<domain>/; technical guides in cookbooks/;
  decisions in decisions/; and goals in Notion, linked from ROADMAP.md. Keep
  unique knowledge in knowledge/ and continuous research in research/<unit>/.
  Use
  skills/use-afs/scripts/validate-afs.mjs to verify structure when available.
